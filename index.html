<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字名づけ支援：パーツ・イメージ検索</title>
<style>
:root{--primary-color:#2c3e50;--accent-color:#3498db;--bg-color:#f8f9fa;--card-bg:#fff;--text-color:#333}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:20px}
.container{max-width:800px;margin:0 auto}
header{text-align:center;margin-bottom:30px}
header h1{font-size:1.5rem;color:var(--primary-color);margin-bottom:5px}
header p{font-size:.9rem;color:#666}
.search-box{background:var(--card-bg);padding:20px;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);margin-bottom:20px}
.filter-group{margin-bottom:15px}
.filter-group>label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:5px;color:var(--primary-color)}
input[type=text]{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ddd;border-radius:6px;font-size:1rem}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{background:#eef2f7;border:1px solid #dcdde1;padding:6px 12px;border-radius:20px;font-size:.85rem;cursor:pointer;user-select:none;transition:all .2s}
.chip.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.chip.dim{opacity:.4}
.btn{background:#fff;border:1px solid var(--accent-color);color:var(--accent-color);padding:8px 14px;border-radius:6px;font-size:.9rem;cursor:pointer}
.btn.primary{background:var(--accent-color);color:#fff}
.suggest{background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:8px 10px;font-size:.85rem;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.result-count{font-size:.9rem;color:#666;margin-bottom:10px}
.kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}
.kanji-card{background:var(--card-bg);border-radius:10px;padding:15px;box-shadow:0 2px 4px rgba(0,0,0,.04);border-left:4px solid var(--accent-color)}
.kanji-header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:8px}
.kanji-char{font-size:2rem;font-weight:bold;color:var(--primary-color);line-height:1}
.kanji-meta{font-size:.8rem;color:#666}
.kanji-readings{font-size:.85rem;margin-bottom:6px}
.kanji-desc{font-size:.8rem;color:#555;line-height:1.4}
.kanji-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.kanji-tag{background:#f1f2f6;font-size:.75rem;padding:2px 6px;border-radius:4px;color:#57606f}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
#modal.open{display:block}
.sheet{background:#fff;max-width:800px;margin:5vh auto 0;height:90vh;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
.sheet-head{padding:14px 16px;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center}
.sheet-head input{flex:1}
.sheet-body{padding:14px 16px;overflow-y:auto;flex:1}
.sheet-body h3{font-size:.9rem;margin:14px 0 8px;color:var(--primary-color)}
.grow{margin-bottom:10px}
.members{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 12px}
.big{font-size:1.1rem}
.note{font-size:.8rem;color:#777}
.sub{padding:8px 16px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.sub select{padding:6px;border:1px solid #ddd;border-radius:6px;font-size:.9rem}
.hdr{width:100%;font-size:.75rem;color:#888;margin:8px 0 0}
.exp{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px 12px}
.compat{font-size:.75rem;color:#8a6d3b;margin-top:6px}
.okuri{font-weight:300;font-size:.85em;color:#8a8f98}
.grp-row{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp-row .chip{white-space:nowrap}
.grp-row .chip.big{font-size:1.1rem}
.grp-row .exp{margin-left:12px}
.more-wrap{text-align:center;margin:16px 0}
footer{max-width:800px;margin:30px auto 0;padding-top:12px;border-top:1px solid #ddd;font-size:.75rem;color:#777;line-height:1.6}
footer a{color:#777}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>漢字名づけ支援ツール</h1>
  <p>パーツやイメージから、想いにぴったりの一字を探す</p>
</header>

<div class="search-box">
  <div class="filter-group">
    <label for="readingInput">読み・名乗り（ひらがな）</label>
    <input type="text" id="readingInput" placeholder="例: み, き, はる, てる など">
  </div>

  <div class="filter-group">
    <label for="partInput">パーツ・構成要素（入力した字そのまま検索）</label>
    <input type="text" id="partInput" placeholder="例: 車 日 氵（複数ならすべてを含む漢字）">
    <div id="suggestBox"></div>
    <div style="margin-top:8px"><button class="btn" id="openPicker">入力できないパーツを選ぶ</button></div>
    <div id="selectedParts" class="tag-chips"></div>
  </div>

  <div class="filter-group">
    <label>イメージ・意味タグ（複数選択可）</label>
    <div id="tagContainer" class="tag-chips"></div>
  </div>

  <button class="btn" id="clearAll">条件をすべてクリア</button>
</div>

<div id="resultCount" class="result-count">検索結果: 0件</div>
<div id="kanjiGrid" class="kanji-grid"></div>
<div id="moreWrap" class="more-wrap"></div>
<footer>
  <p>漢字の読み・画数・部首などのデータは、<a href="https://www.edrdg.org/wiki/index.php/KANJIDIC_Project" target="_blank" rel="noopener">KANJIDIC2</a>（© Electronic Dictionary Research and Development Group）を元にしています。<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 4.0</a> のもとで利用しています。内容は編集・加工しています。</p>
  <p>常用漢字・人名用漢字の範囲は、文化庁・法務省の公表資料に基づいています。</p>
</footer>
</div>

<!-- パーツ選択画面 -->
<div id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <input type="text" id="pickerFilter" placeholder="パーツを絞り込み（字や名前）">
      <button class="btn primary" id="closePicker">完了</button>
    </div>
    <div class="sub">
      <label>画数 <select id="strokeSel"><option value="0">すべて</option></select></label>
      <label><input type="checkbox" id="showMinor"> 1字だけ含むパーツも表示</label>
    </div>
    <div class="sheet-body" id="pickerBody"></div>
  </div>
</div>

<script>
let kanjiData = [], groups = [], partsInfo = null;
const state = { groups: new Set(), chars: new Set(), tags: new Set() };
const openGroups = new Set();
let charToGroup = new Map(), partFreq = new Map(), groupMap = new Map();
const PAGE = 120;               // 一度に表示する件数
let lastResults = [], shown = 0;
let timer = null, composing = false;

// 部首用の別コードの字を、ふつうの字に統一する対応表
const NORM = {'⺡':'氵','⺗':'忄','⺾':'艹','⻌':'辶','⺨':'犭','⻟':'飠'};
const norm = c => NORM[c] || c;
// カタカナ→ひらがな、「.」「-」を除去（読み検索用）
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[.\-]/g, '');
const $ = id => document.getElementById(id);

// ---- 読みの整理 ----
// 「-ぞい」「はや-」のような接続形は表示も検索もしない
const isJoin = r => r.startsWith('-') || r.endsWith('-');
const usable = arr => (arr || []).filter(r => !isJoin(r));
// 送り仮名（「.」以降）を細く小さい文字にする： は.や.い → は<細>やい</細>
function okuriHTML(r) {
  const i = r.indexOf('.');
  if (i < 0) return r;
  return r.slice(0, i) + '<span class="okuri">' + r.slice(i + 1).replace(/\./g, '') + '</span>';
}

// ---------- 読み込み ----------
async function loadData() {
  try {
    kanjiData = await (await fetch('data.json')).json();
  } catch (e) {
    $('kanjiGrid').innerHTML = '<p style="color:red;">data.jsonを読み込めませんでした。</p>';
    return;
  }
  try { groups = await (await fetch('groups.json')).json(); } catch (e) { groups = []; }
  try { partsInfo = await (await fetch('parts.json')).json(); } catch (e) { partsInfo = null; }
  const sel = $('strokeSel');
  for (let i = 2; i <= 9; i++) sel.add(new Option(i + '画', i));
  sel.add(new Option('10画以上', 10));
  groups.forEach(g => { g.members = g.members.map(norm); g.members.forEach(m => charToGroup.set(m, g)); groupMap.set(g.id, g); });
  kanjiData.forEach(buildParts);
  initTags();
  restoreFromURL();
  update();
}

// 各漢字の「パーツ一覧」＝ components ＋ 部首欄
function buildParts(item) {
  const s = new Set();
  item.components.forEach(c => { c = (c || '').trim(); if (c) s.add(norm(c)); });
  const toks = item.radical.split(/\s+/).filter(Boolean);
  toks.forEach(t => { if (toks[0] === '肉' && t === '月') t = '⺼'; s.add(norm(t)); }); // 月とにくづきは別扱い
  item._parts = s;
  item._rs = [...usable(item.readings.on), ...usable(item.readings.kun), ...usable(item.readings.nanori)].map(toHira);
  s.forEach(p => partFreq.set(p, (partFreq.get(p) || 0) + 1));
}

function initTags() {
  const all = new Set();
  kanjiData.forEach(k => k.tags.forEach(t => all.add(t)));
  $('tagContainer').innerHTML = '';
  all.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'chip'; chip.textContent = tag; chip.dataset.tag = tag;
    chip.onclick = () => { state.tags.has(tag) ? state.tags.delete(tag) : state.tags.add(tag); update(); };
    $('tagContainer').appendChild(chip);
  });
}

// ---------- 条件 ----------
const typedChars = () => [...$('partInput').value].filter(c => c.trim() && !',、'.includes(c)).map(norm);

function filterKanji() {
  // 条件は最初に1回だけ用意する（漢字ごとに作り直さない）
  const rq = toHira($('readingInput').value.trim().normalize('NFC'));
  const need = [...typedChars(), ...state.chars];
  const gs = [...state.groups].map(id => groupMap.get(id)).filter(Boolean);
  const tags = [...state.tags];
  return kanjiData.filter(item => {
    if (rq && !item._rs.some(r => r.includes(rq)) && !item.kanji.includes(rq)) return false;
    for (const ch of need) if (!item._parts.has(ch)) return false;
    for (const g of gs) if (!g.members.some(m => item._parts.has(m))) return false; // グループ内はOR
    for (const t of tags) if (!item.tags.includes(t)) return false;
    return true;
  });
}

// ---------- 表示 ----------
function update() {
  renderResults(filterKanji());
  renderSelected();
  renderSuggest();
  document.querySelectorAll('#tagContainer .chip').forEach(c => c.classList.toggle('active', state.tags.has(c.dataset.tag)));
  syncURL();
  if ($('modal').classList.contains('open')) renderPicker();
}

function cardHTML(item) {
  const on = usable(item.readings.on).join(', ') || '-';
  const kun = usable(item.readings.kun).map(okuriHTML).join(', ') || '-';
  const na = usable(item.readings.nanori).join(' / ') || '-';
  return `<div class="kanji-card">
      <div class="kanji-header"><span class="kanji-char">${item.kanji}</span>
        <div class="kanji-meta">画数: ${item.strokes}画<br>部首: ${item.radical}</div></div>
      <div class="kanji-readings">
        <strong>音:</strong> ${on}<br>
        <strong>訓:</strong> ${kun}<br>
        <strong>名:</strong> ${na}</div>
      <div class="kanji-desc">${item.description}</div>
      ${item.compat ? `<div class="compat">※人名用に認められた同形の互換字があります（${item.compat.map(c => 'U+' + c.toUpperCase()).join('、')}）</div>` : ''}
      <div class="kanji-tags">${item.tags.map(t => `<span class="kanji-tag">#${t}</span>`).join('')}</div></div>`;
}

// 結果は PAGE 件ずつ表示（全件を一度に作ると重くなるため）
function renderResults(results) {
  lastResults = results; shown = 0;
  $('resultCount').textContent = `検索結果: ${results.length}件`;
  const grid = $('kanjiGrid');
  if (!results.length) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">条件に一致する漢字が見つかりませんでした。</p>';
    $('moreWrap').innerHTML = ''; return;
  }
  grid.innerHTML = '';
  showMore();
}
function showMore() {
  const next = lastResults.slice(shown, shown + PAGE);
  $('kanjiGrid').insertAdjacentHTML('beforeend', next.map(cardHTML).join(''));
  shown += next.length;
  const w = $('moreWrap'); w.innerHTML = '';
  if (shown < lastResults.length) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = `さらに表示（${shown} / ${lastResults.length}件）`;
    b.onclick = showMore; w.appendChild(b);
  }
}

// 選択中のパーツ（×で解除）
function renderSelected() {
  const box = $('selectedParts'); box.innerHTML = '';
  const add = (text, fn) => { const c = document.createElement('div'); c.className = 'chip active'; c.textContent = text + ' ×'; c.onclick = fn; box.appendChild(c); };
  state.groups.forEach(id => { const g = groups.find(x => x.id === id); if (g) add(g.label + ' グループ', () => { state.groups.delete(id); update(); }); });
  state.chars.forEach(ch => add(ch, () => { state.chars.delete(ch); update(); }));
}

// 入力欄にグループ所属の字があれば提案
function renderSuggest() {
  const box = $('suggestBox'); box.innerHTML = '';
  const seen = new Set();
  typedChars().forEach(ch => {
    const g = charToGroup.get(ch);
    if (!g || seen.has(g.id) || state.groups.has(g.id)) return;
    seen.add(g.id);
    const d = document.createElement('div'); d.className = 'suggest';
    d.innerHTML = `<span>「${ch}」は「${g.label}」グループ（${g.members.join('・')}）にも含められます。</span>`;
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'グループで探す';
    b.onclick = () => {
      $('partInput').value = [...$('partInput').value].filter(c => !g.members.includes(norm(c))).join('');
      state.groups.add(g.id); update();
    };
    d.appendChild(b); box.appendChild(d);
  });
}

// ---------- パーツ選択画面 ----------
function mkChip(text, active, fn, extra) {
  const c = document.createElement('div');
  c.className = 'chip' + (active ? ' active' : '') + (extra ? ' ' + extra : '');
  c.textContent = text; c.onclick = fn; return c;
}
function renderPicker() {
  const body = $('pickerBody'); body.innerHTML = '';
  const q = $('pickerFilter').value.trim();
  const sv = +$('strokeSel').value, minor = $('showMinor').checked;
  const live = p => partFreq.get(p) || 0;
  const toggleChar = x => () => { state.chars.has(x) ? state.chars.delete(x) : state.chars.add(x); update(); };
  const toggleGroup = g => () => { state.groups.has(g.id) ? state.groups.delete(g.id) : state.groups.add(g.id); update(); };
  const head = (text, note) => {
    const h = document.createElement('h3'); h.textContent = text; body.appendChild(h);
    if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; body.appendChild(n); }
  };
  const box = () => { const w = document.createElement('div'); w.className = 'tag-chips'; body.appendChild(w); return w; };
  // グループは1グループごとに1行（文字の大きさは他のパーツと同じ）
  const addGroup = (wrap, g, text) => {
    const row = document.createElement('div'); row.className = 'grp-row';
    row.appendChild(mkChip(text || g.label, state.groups.has(g.id), toggleGroup(g), 'big'));
    row.appendChild(mkChip(openGroups.has(g.id) ? '▲閉じる' : '▼形を指定', false, () => { openGroups.has(g.id) ? openGroups.delete(g.id) : openGroups.add(g.id); renderPicker(); }, 'dim'));
    if (openGroups.has(g.id)) {
      const m = document.createElement('div'); m.className = 'exp';
      g.members.filter(x => live(x)).forEach(x => m.appendChild(mkChip(`${x} (${live(x)})`, state.chars.has(x), toggleChar(x), 'big')));
      row.appendChild(m);
    }
    wrap.appendChild(row);
  };
  // ① おすすめ
  if (partsInfo && !q) {
    head('おすすめパーツ', 'タップで選択。形が変わるものは「▼形を指定」で特定の形だけに絞れます。');
    const w = box();
    partsInfo.recommended.forEach(e => {
      const g = e.group && groups.find(x => x.id === e.group);
      if (g) addGroup(w, g, e.label);
      else { const p = norm(e.forms[0]); w.appendChild(mkChip(p, state.chars.has(p), toggleChar(p), 'big' + (live(p) ? '' : ' dim'))); }
    });
  }
  // ② グループ一覧
  head('形が変わるパーツ（グループ）');
  const gw = box();
  groups.filter(g => !q || g.label.includes(q) || g.members.some(m => q.includes(m))).forEach(g => addGroup(gw, g, `${g.label}（${g.members.join('・')}）`));
  // ③ すべてのパーツ（画数順）
  head('すべてのパーツ（画数順）', '氵などグループの形は、上のグループから選びます。');
  let list = partsInfo ? partsInfo.parts.map(e => ({ p: norm(e.p), s: e.strokes }))
                       : [...partFreq.keys()].map(p => ({ p, s: 0 }));
  list = list.filter(x => !charToGroup.has(x.p) && live(x.p) >= (minor ? 1 : 2) && (!q || q.includes(x.p)) &&
                          (!sv || (sv === 10 ? x.s >= 10 : x.s === sv)));
  list.sort((a, b) => a.s - b.s || live(b.p) - live(a.p));
  if (!list.length) { const n = document.createElement('div'); n.className = 'note'; n.textContent = '該当するパーツがありません。'; body.appendChild(n); }
  let w = null, cur = -1;
  list.forEach(x => {
    if (x.s !== cur) { cur = x.s; w = box(); if (x.s) { const h = document.createElement('div'); h.className = 'hdr'; h.textContent = x.s + '画'; w.appendChild(h); } }
    w.appendChild(mkChip(`${x.p} (${live(x.p)})`, state.chars.has(x.p), toggleChar(x.p), 'big'));
  });
}

// ---------- URL連動 ----------
function syncURL() {
  const p = new URLSearchParams();
  const set = (k, v) => { if (v) p.set(k, v); };
  set('r', $('readingInput').value.trim());
  set('p', $('partInput').value.trim());
  set('g', [...state.groups].join(','));
  set('c', [...state.chars].join(','));
  set('t', [...state.tags].join(','));
  const s = p.toString();
  history.replaceState(null, '', s ? '?' + s : location.pathname);
}
function restoreFromURL() {
  const p = new URLSearchParams(location.search);
  $('readingInput').value = p.get('r') || '';
  $('partInput').value = p.get('p') || '';
  (p.get('g') || '').split(',').filter(Boolean).forEach(x => state.groups.add(x));
  (p.get('c') || '').split(',').filter(Boolean).forEach(x => state.chars.add(x));
  (p.get('t') || '').split(',').filter(Boolean).forEach(x => state.tags.add(x));
}

// ---------- イベント ----------
// 入力のたびに検索せず、入力が止まってから検索する。変換中（IME）は待つ。
function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }
['readingInput', 'partInput'].forEach(id => {
  const el = $(id);
  el.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
  el.addEventListener('compositionend', () => { composing = false; schedule(update, 150); });
  el.addEventListener('input', e => { if (composing || e.isComposing) return; schedule(update, 150); });
});
$('pickerFilter').addEventListener('input', () => schedule(renderPicker, 150));
$('strokeSel').addEventListener('change', renderPicker);
$('showMinor').addEventListener('change', renderPicker);
$('openPicker').onclick = () => { $('modal').classList.add('open'); renderPicker(); };
$('closePicker').onclick = () => $('modal').classList.remove('open');
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').classList.remove('open'); };
$('clearAll').onclick = () => {
  $('readingInput').value = ''; $('partInput').value = '';
  state.groups.clear(); state.chars.clear(); state.tags.clear(); update();
};

loadData();
</script>
</body>
</html>
